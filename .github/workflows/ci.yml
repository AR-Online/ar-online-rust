name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: ['**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  quality:
    name: Formato, clippy e ortografia
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings

      - name: Ortografia
        uses: codespell-project/actions-codespell@v2

  test:
    name: Testes (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Ver o resultado de todas mesmo quando uma reprova: o servidor de
      # mentira abre socket e thread, e é aí que sistema operacional difere.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - run: cargo test --all-targets
      - name: Doctests
        run: cargo test --doc

  msrv:
    name: Compila na versão mínima (1.79)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.79
      - uses: Swatinem/rust-cache@v2

      # rust-version no Cargo.toml é promessa; sem este job, é promessa que
      # ninguém confere — e quebra na máquina do parceiro, não na nossa.
      - run: cargo build

  coverage:
    name: Cobertura mínima de 95%
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2

      - run: cargo llvm-cov --all-targets --fail-under-lines 95

  audit:
    name: Auditoria de dependências
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # Sem allow_failure: vulnerabilidade conhecida reprova. É a mesma regra
      # do portão da API — um aviso que não reprova é um aviso que ninguém lê.
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
