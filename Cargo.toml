[package]
name = "aronline-sdk"
version = "0.1.0"
edition = "2021"
rust-version = "1.79"
description = "SDK oficial da API do AR Online (/v3)"
authors = ["AR ONLINE TECNOLOGIA LTDA"]
license = "Apache-2.0"
readme = "README.md"
homepage = "https://github.com/AR-Online/ar-online-rust"
repository = "https://github.com/AR-Online/ar-online-rust"
documentation = "https://docs.rs/aronline-sdk"
keywords = ["ar-online", "sdk", "api"]
categories = ["api-bindings"]
include = ["src/**/*", "README.md", "LICENSE"]

[lib]
name = "aronline"
path = "src/lib.rs"

[dependencies]

[lints.rust]
missing_docs = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
