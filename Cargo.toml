[package]
name = "aronline-sdk"
version = "0.1.0"
edition = "2021"
# 1.85, e nao 1.79: o `ureq-proto` (via ureq 3) exige edition2024, que so
# existe a partir do Cargo 1.85. Prometer 1.79 era promessa que o CI da
# versao minima derrubou na primeira execucao.
rust-version = "1.85"
description = "SDK oficial da API do AR Online (/v3)"
authors = ["AR ONLINE TECNOLOGIA LTDA"]
license = "Apache-2.0"
readme = "README.md"
homepage = "https://github.com/AR-Online/ar-online-rust"
repository = "https://github.com/AR-Online/ar-online-rust"
documentation = "https://docs.rs/aronline-sdk"
keywords = ["ar-online", "sdk", "api"]
categories = ["api-bindings"]
include = ["src/**/*", "README.md", "LICENSE"]

[lib]
name = "aronline"
path = "src/lib.rs"

[dependencies]
# A unica linguagem das cinco que carrega dependencia, porque a std nao tem
# HTTP nem JSON. ureq e sincrono e nao arrasta runtime assincrono junto: um
# SDK nao escolhe o executor da aplicacao que o instala.
ureq = { version = "3", default-features = false, features = ["rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# O SDK e o que o parceiro instala: um panic aqui derruba o processo dele.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
